spring.application.name=cafeteria2

# ---------- Datasource ----------
spring.datasource.url=jdbc:mysql://localhost:3306/cafeteria?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# ---------- JPA / Hibernate ----------
# O schema NAO e mais gerenciado pelo Hibernate: quem cria e versiona as
# tabelas e o Flyway. "validate" apenas confere se as entidades batem com
# o schema criado pelas migrations (em producao pode-se usar "none").
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- Flyway (versionamento de banco) ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
